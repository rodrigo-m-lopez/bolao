{% extends 'menu_base.html' %}
{% set title = 'Ranking' %}

{% block css %}<script src="{{ url_for('static', filename='Chart.min.js') }}"></script>{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-10">
    <div class="card">
      <div class="card-header d-flex align-items-center gap-2">
        <i class="fa fa-line-chart"></i>
        <span>Evolução no ranking — <strong>{{ nome_aposta }}</strong></span>
      </div>
      <div class="card-body">
        <p class="text-muted small mb-3">
          <i class="fa fa-info-circle me-1"></i>
          Posição no ranking ao longo das rodadas. Eixo Y: posição (menor = melhor).
        </p>
        <div style="position:relative; width:100%; padding-bottom:56%">
          <canvas id="chart" style="position:absolute;top:0;left:0;width:100%;height:100%"></canvas>
        </div>
        <script>
          var barData = {
            labels: [{% for item in labels %}{{ item | tojson }},{% endfor %}],
            datasets: [{
              fillColor: "rgba(0,156,59,0.08)",
              strokeColor: "rgba(0,156,59,1)",
              pointColor: "rgba(0,156,59,1)",
              pointStrokeColor: "#fff",
              pointHighlightFill: "#fff",
              pointHighlightStroke: "rgba(0,156,59,1)",
              bezierCurve: false,
              data: [{% for item in values %}{{ item }},{% endfor %}]
            }]
          };
          Chart.defaults.global.animationSteps = 30;
          Chart.defaults.global.responsive = true;
          Chart.defaults.global.maintainAspectRatio = false;
          Chart.defaults.global.scaleFontSize = 11;
          Chart.defaults.global.tooltipFillColor = "rgba(0,0,0,.75)";
          new Chart(document.getElementById('chart').getContext('2d')).Line(barData, {
            scaleOverride: true,
            scaleSteps: {{ qtd_participantes - 1 }},
            scaleStepWidth: -1,
            scaleStartValue: {{ qtd_participantes }},
            scaleShowVerticalLines: true,
            bezierCurve: false,
            scaleShowLabels: true
          });
        </script>
      </div>
    </div>
    <div class="mt-3">
      <a href="{{ url_for('ranking', bolao=bolao) }}" class="btn btn-outline-secondary btn-sm">
        <i class="fa fa-arrow-left me-1"></i> Voltar ao ranking
      </a>
    </div>
  </div>
</div>
{% endblock %}
