{% extends 'menu_gerencia_bolao.html' %}
{% set title = 'Novo Bolão' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header"><i class="fa fa-plus-circle me-2"></i>Novo Bolão</div>
      <div class="card-body">
        <form method="POST" action="/novo_bolao" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="inputNome" class="form-label fw-semibold">Nome do Bolão</label>
            <input type="text" class="form-control" id="inputNome" name="inputNome"
                   placeholder="Ex.: Bolão da Turma do Trabalho" required onblur="validaNomeBolao()">
            <div id="divErro" class="mt-1"></div>
          </div>

          <div class="mb-3">
            <label for="inputValor" class="form-label fw-semibold">Valor da aposta</label>
            <div class="input-group">
              <span class="input-group-text">R$</span>
              <input type="number" min="0" step="1" class="form-control" id="inputValor" name="inputValor"
                     placeholder="0" required>
              <span class="input-group-text">,00</span>
            </div>
          </div>

          <div class="mb-3">
            <label for="inputPremiacao" class="form-label fw-semibold">Premiação</label>
            <textarea class="form-control" id="inputPremiacao" name="inputPremiacao"
                      placeholder="Ex.: 60% ao 1º, 30% ao 2º, 10% ao 3º" rows="3" required></textarea>
          </div>

          <div class="mb-3">
            <label for="inputCompeticao" class="form-label fw-semibold">Competição</label>
            <select class="form-select" id="inputCompeticao" name="inputCompeticao" required>
              <option value="" disabled selected>Selecione a competição…</option>
              {% for comp in competicoes %}
              <option value="{{ comp }}">{{ comp }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label for="inputDescricao" class="form-label fw-semibold">Descrição <span class="text-muted fw-normal">(opcional)</span></label>
            <textarea class="form-control" id="inputDescricao" name="inputDescricao"
                      placeholder="Regras extras, informações de pagamento, etc." rows="3"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="fa fa-check me-1"></i> Criar Bolão
            </button>
            <a href="/lista_bolao" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
function validaNomeBolao() {
  var val = document.getElementById('inputNome').value;
  var el  = document.getElementById('divErro');
  if (!val.trim()) { el.innerHTML = ''; return; }
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function () {
    if (this.readyState === 4 && this.status === 200) {
      el.innerHTML = montaAlerta(this.responseText);
      if (this.responseText) document.getElementById('inputNome').select();
    }
  };
  xhr.open('POST', '/valida_nome_bolao', true);
  xhr.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');
  xhr.setRequestHeader('X-CSRFToken', document.querySelector('meta[name="csrf-token"]').content);
  xhr.send('nome_bolao=' + encodeURIComponent(val));
}
</script>
{% endblock %}
