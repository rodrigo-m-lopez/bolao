{% extends 'base.html' %}

{% block content %}
        {% if not current_user.is_authenticated %}
            {% if config.DEV_MOCK_AUTH %}
            <div style="background:#fff3cd;border:1px solid #ffc107;padding:12px 16px;border-radius:6px;margin-bottom:16px;max-width:360px;">
                <strong>&#9888; Modo desenvolvimento</strong><br>
                <small>Autenticação Google desabilitada. Não use em produção.</small>
            </div>
            <a href="{{ url_for('dev_login') }}" style="display:inline-block;padding:10px 20px;background:#4285f4;color:#fff;border-radius:4px;text-decoration:none;font-weight:bold;">
                &#128100; Entrar como Dev User
            </a>
            {% else %}
            <a href={{ url_for('oauth_authorize', provider='google') }}><img src="{{ url_for('static', filename='sign-in-with-google.png') }}" /></a>
            {% endif %}
        {% endif %}
{% endblock %}

{% set title = 'Login' %}
